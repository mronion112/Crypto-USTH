[package]
name = "toy-key-recovery"
version = "0.1.0"
edition = "2024"
description = "Toy RSA and ECDLP key-recovery benchmark"

[lib]
name = "toy_key_recovery"
path = "src/lib.rs"

[[bin]]
name = "toy-bench"
path = "src/main.rs"

[[bin]]
name = "gen-curve"
path = "src/bin/gen_curve.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
